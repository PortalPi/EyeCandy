name: Bug report
description: Something in Eye Candy is broken, wrong or confusing.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. This takes about a minute.

        1. In game, type `/ec report`.
        2. A box opens with your report. Press Ctrl+C to copy it.
        3. Paste it into the last box below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Say what you did and what went wrong. Short is fine.
      placeholder: "I picked the Moody look and my screen went black."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: false
  - type: textarea
    id: report
    attributes:
      label: Your report
      description: Paste everything from `/ec report`. It holds your Eye Candy version, game build, your graphics settings and any Lua errors from Eye Candy. It has no passwords and no chat. Have a look before you post, and take out anything you want private.
      placeholder: "=== Eye Candy bug report ==="
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Other addons you use, a screenshot, your graphics card.
    validations:
      required: false
