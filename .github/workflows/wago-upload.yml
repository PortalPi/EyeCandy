name: wago-upload

# Uploads one released version to Wago only, for when the release run's Wago upload failed
# (for example a wrong WAGO_API_TOKEN) and CurseForge and GitHub already have it.
# Run it from the Actions tab: wago-upload > Run workflow, and give the tag, for example v1.0.0.
# It passes only the Wago token, so the packager skips CurseForge and the GitHub release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The released tag to upload, for example v1.0.0"
        required: true
      changelog-from-main:
        description: "Use main's CHANGELOG.md instead of the tag's, when the notes were fixed after the release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wago:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release # the token lives here, behind the maintainer's approval
    steps:
      - name: The tag must be a release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v1.0.0."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0 # the packager reads tags and history

      - name: Use main's changelog
        if: ${{ inputs.changelog-from-main }}
        # The packager reads CHANGELOG.md from the working folder, for the zip and the Wago notes.
        run: git show origin/main:CHANGELOG.md > CHANGELOG.md

      - name: Package and upload to Wago
        # The same pinned packager commit as release.yml (v2.7.0).
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
