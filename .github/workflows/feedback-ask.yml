name: feedback-ask

# When the sort routine decides a player's issue is a bug or an idea that fits Eye Candy, it
# comments on the issue as the maintainer, starting with <!-- eyecandy-sort: ask -->. This sends
# the maintainer a phone notification (ntfy) with Yes and No buttons; tapping it opens that comment.
# How the buttons are checked: .github/scripts/feedback_phone.py.
#
# Secrets (Settings > Secrets and variables > Actions): NTFY_TOPIC and APPROVE_KEY.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  ask:
    # Only the maintainer's own comments, on issues, that start with the marker. A stranger's
    # comment never runs this job, so it never sees the secrets.
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '<!-- eyecandy-sort: ask -->')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Send the phone notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APPROVE_KEY: ${{ secrets.APPROVE_KEY }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python3 .github/scripts/feedback_phone.py ask
